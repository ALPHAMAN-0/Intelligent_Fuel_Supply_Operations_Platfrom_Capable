id: CR-03
name: Depot constraint
description: >
  Gazipur depot becomes CONSTRAINED for 6 hours and its next resupply delivers only 40% of the planned volume. The
  platform must surface the constraint and the shortfall, keep planning within the reduced stock, and show the impact.
mode: auto
policy: planner
ticks: 48
events:
  - type: depot_constraint
    start_tick: 2
    duration_ticks: 24
    parameters: { depot_ids: [depot-gazipur] }
  - type: supply_shortfall
    start_tick: 2
    duration_ticks: 1          # one-shot: quantity *= factor on matching SCHEDULED arrivals
    parameters: { factor: 0.4, depot_ids: [depot-gazipur] }
expect:
  alerts_raised: [event, network, supply]
  resolved_by_end: [network]
  min_final_service_level: 0.95
