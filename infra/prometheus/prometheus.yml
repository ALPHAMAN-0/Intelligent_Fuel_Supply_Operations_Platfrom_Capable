# Scrapes both FuelOps services. The default prometheus_client collectors also export process_* (CPU, memory,
# file descriptors) per service, which the dashboard uses for system metrics.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]
  - job_name: intelligence
    static_configs:
      - targets: ["intelligence:8090"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
