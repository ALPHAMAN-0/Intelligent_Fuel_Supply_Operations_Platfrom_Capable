# Source -> Build -> Test -> Package -> Deploy (compose) -> Health check -> Running  (R-DEVOPS-02/03)
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check . ../TestCase ../scripts ../infra ../loadtest
      - name: pytest (unit + in-process e2e, coverage)
        run: python -m pytest --cov=fuelops --cov-report=term --cov-fail-under=80
      - name: TestCase suite
        working-directory: .
        run: python -m pytest TestCase -W ignore::DeprecationWarning

  frontend:
    name: console lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage   # fails below 80% lines/branches/functions/statements

  contract:
    name: contract tests vs the published simulator
    runs-on: ubuntu-latest
    services:
      simulator:
        image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
        ports: ["8000:8000"]
        env:
          SIMULATOR_START_MODE: paused
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"
          --health-interval 5s --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: simulator contract (reset -> allocate -> step -> ARRIVED, error envelopes, idempotency)
        env:
          CONTRACT_SIM_URL: http://localhost:8000
        run: python -m pytest tests/test_simulator_contract.py

  compose-smoke:
    name: build image + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: configure (.env from .env.example with a throwaway token)
        run: |
          cp .env.example .env
          echo "OPERATOR_TOKEN=$(openssl rand -hex 24)" >> .env
          echo "SIMULATOR_START_MODE=paused" >> .env
      - name: build
        run: docker compose build backend
      - name: deploy
        run: docker compose up -d --wait --wait-timeout 180 simulator intelligence backend
      - name: health check
        run: |
          curl -fsS http://localhost:8080/api/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); bad=[c for c in h['components'] if c['status']=='down']; assert not bad, bad"
          curl -fsS http://localhost:8080/login.html | grep -q "SIMULATED DATA"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/verify)" = 401
      - name: crisis scenario replay (CR-01 shipment delay)
        run: docker compose run --rm -T tools scripts/run_scenario.py scenarios/shipment-delay.yaml --out /tmp/scenario
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v

  publish:
    name: push image to GHCR (tagged by commit SHA)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [compose-smoke, contract]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fuelops-server" >> "$GITHUB_ENV"
      - name: build and push
        run: |
          docker build -f server/Dockerfile -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
      - name: rollback hint
        run: echo "Deploy or roll back with IMAGE_REPO=$IMAGE IMAGE_TAG=<sha> docker compose up -d"
